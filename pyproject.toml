[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-terminal"
version = "1.0.0"
description = "Offline-first RC-S300 attendance terminal"
requires-python = ">=3.10"
dependencies = ["pyscard>=2.0,<3"]

[project.optional-dependencies]
gpio = ["gpiozero>=1.6,<3"]
test = ["pytest>=7,<9"]

[project.scripts]
attendance-terminal = "attendance_terminal.main:main"

[tool.setuptools.packages.find]
where = ["src"]
